[package]
name = "git-history-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ureq = { version = "3.3.0", features = ["json"] }

# The window, off by default.
#
# wgpu, naga, ash and fontdue are already in the local registry cache, but winit
# pulls the whole cross-platform windowing world (wayland, x11, objc2, jni) and
# ~20 of those are not cached here. So the window costs one `cargo fetch` on a
# connected machine -- once, exactly like tools\vendor.ps1 -- and the default
# build stays buildable with the wire pulled.
#
#   cargo build --release                      the terminal, offline, as before
#   cargo build --release --features window    adds -w / --vulkan
fontdue = { version = "0.9.3", optional = true }
pollster = { version = "0.3.0", optional = true }
wgpu = { version = "22.1.0", optional = true }
winit = { version = "0.30.13", optional = true }

[features]
default = []
window = ["dep:fontdue", "dep:pollster", "dep:wgpu", "dep:winit"]
